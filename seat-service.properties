# ==========================
# Application Name
# ==========================
spring.application.name=seat-service

# ==========================
# Server Configuration
# ==========================
server.port=8083

# ==========================
# Config Server
# ==========================
spring.config.import=optional:configserver:http://localhost:8888

# ==========================
# MySQL Configuration
# ==========================
spring.datasource.url=jdbc:mysql://localhost:3306/airline_seat_db
spring.datasource.username=root
spring.datasource.password=Dodlanikki@10
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================
# Hibernate / JPA
# ==========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ==========================
# Eureka Client
# ==========================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# ==========================
# Kafka Configuration
# ==========================
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=seat-service-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.zosh.common_lib.event
